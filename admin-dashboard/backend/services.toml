# OpsRelay uptime monitor settings. Sites are added per workspace from the dashboard (Sites), not here;
# a [[services]] entry (see uptime/models.py ServiceConfig) still works for a self-hosted setup.

[monitor]
interval_seconds = 300         # matches the 5-minute GitHub Actions schedule; OPSRELAY_MONITOR_INTERVAL overrides
retention_days = 35            # raw check samples (covers the 30-day window)
incident_retention_days = 180  # resolved incidents
stale_after_intervals = 3      # last check older than 3 intervals -> status "unknown"
