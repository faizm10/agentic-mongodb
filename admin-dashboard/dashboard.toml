# OpsRelay admin dashboard. Paths are relative to this file.
# Health URLs and workflow files are placeholders until the demo apps land.

refresh_seconds = 10
repairs_dir = ".data/repairs"      # RepairResult JSON files (see opsrelay_dashboard/repairs.py)
uptime_log = ".data/uptime.jsonl"  # rolling 24h of health checks, survives restarts
github_repo = "faizm10/agentic-mongodb"

[apps.shopping]
label = "Shopping"
health_url = "http://127.0.0.1:8001/health"
check_interval_seconds = 15
workflow = "shopping.yml"

[apps.messaging]
label = "Messaging"
health_url = "http://127.0.0.1:8002/health"
check_interval_seconds = 15
workflow = "messaging.yml"
